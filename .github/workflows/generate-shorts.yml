name: Generate Short
run-name: "${{ inputs.brief }}"
on:
  workflow_dispatch:
    inputs:
      brief:
        description: "What to compare, e.g. 'India vs China population 1960-2024' or 'Countries by life expectancy'"
        required: true
        type: string
      format:
        description: "Auto picks from the data: 2 subjects → Versus, more → Race"
        default: Auto
        type: choice
        options: [Auto, Race, Versus]
      duration:
        description: "Seconds (30–90)"
        default: "50"
        type: string
      theme:
        default: Light
        type: choice
        options: [Light, Dark]
      music:
        description: "Auto uses tracks in assets/music if present, else generated music"
        default: Auto
        type: choice
        options: [Auto, Procedural, None]
      seed:
        default: "42"
        type: string
      upload_to_youtube:
        description: "Upload privately (needs YOUTUBE_* secrets)"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INPUT_BRIEF: ${{ inputs.brief }}
      INPUT_FORMAT: ${{ inputs.format }}
      INPUT_DURATION: ${{ inputs.duration }}
      INPUT_THEME: ${{ inputs.theme }}
      INPUT_MUSIC: ${{ inputs.music }}
      INPUT_SEED: ${{ inputs.seed }}
      INPUT_UPLOAD: ${{ inputs.upload_to_youtube }}
      SHORTS_MODEL: qwen3:8b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)

      - name: Install package
        run: |
          if [ "$INPUT_UPLOAD" = "true" ]; then pip install '.[upload]'; else pip install .; fi

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.SHORTS_MODEL }}

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$SHORTS_MODEL"

      - name: Make the video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m shorts.main --out output

      - name: Summary
        if: always()
        run: |
          mkdir -p output
          [ -f output/production_report.md ] && cat output/production_report.md >> "$GITHUB_STEP_SUMMARY" || echo "Setup failed before generation; see the log above." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: output/
          retention-days: 14
