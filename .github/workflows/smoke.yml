name: Live data smoke test
# Verify the complete pipeline after removal of legacy topic rules.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke.yml'
permissions:
  contents: read
jobs:
  demographic_discovery:
    uses: ./.github/workflows/generate-shorts.yml
    with:
      brief: 'Male vs female population in the USA, 1960–2025'
      duration: '30'
      format: Race
      artifact_label: demographics
      require_real_data: true
      upload_to_youtube: false
  metric_discovery:
    uses: ./.github/workflows/generate-shorts.yml
    with:
      brief: 'India vs China unemployment total percent of total labor force national estimate, 2000–2020'
      duration: '30'
      format: Versus
      artifact_label: unemployment
      require_real_data: true
      upload_to_youtube: false
