[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "data-chart-shorts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "pydantic>=2.10,<3", "Pillow>=11,<13", "numpy>=2,<3", "piper-tts==1.3.0", "faster-whisper==1.2.1", "av>=14,<16"]
[project.scripts]
data-shorts = "shorts.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
