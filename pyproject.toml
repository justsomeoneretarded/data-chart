[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-chart-shorts"
version = "2.0.0"
description = "Turn a one-line brief into a data-driven YouTube Short using real published data"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "pydantic>=2.10,<3",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "beautifulsoup4>=4.12,<5",
  "pycountry>=24",
  "ddgs>=9,<10",
]

[project.optional-dependencies]
upload = ["google-api-python-client>=2,<3", "google-auth>=2,<3"]
dev = ["pytest>=8"]

[project.scripts]
data-shorts = "shorts.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
